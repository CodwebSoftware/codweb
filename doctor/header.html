<header class="canvas-header" style="display: flex; justify-content: space-between; align-items: center;">
    <div class="canvas-title-wrapper" style="display: flex; align-items: center; gap: 12px;">
        <button class="btn btn-secondary" id="hamburger-toggle-btn" title="Toggle Menu" style="display: none; padding: 8px 12px; border-radius: 8px; justify-content: center; align-items: center;">
            <i class="ri-menu-line"></i>
        </button>
        <span class="canvas-title" id="active-slide-title">Welcome</span>
        <span class="canvas-subtitle" id="active-slide-badge">Overview</span>
    </div>
    <button class="btn btn-primary" id="canvas-fullscreen-btn" title="Toggle Fullscreen" style="border-radius: 12px; display: flex; align-items: center; gap: 8px;">
        <i class="ri-fullscreen-fill"></i> <span>Full Screen</span>
    </button>
</header>
